```dart
import 'package:flutter/material.dart';
import 'package:hive_flutter/hive_flutter.dart';
import 'package:permission_handler/permission_handler.dart';
import 'package:geolocator/geolocator.dart';
import 'package:flutter_tts/flutter_tts.dart';
import 'package:url_launcher/url_launcher.dart';

void main() async {
  WidgetsFlutterBinding.ensureInitialized();
  await Hive.initFlutter();
  
  // Opening Hive 5 Boxes as per Blueprint
  await Hive.openBox('companyBox');
  await Hive.openBox('productBox');
  await Hive.openBox('callDiaryBox');
  await Hive.openBox('voiceBox');
  await Hive.openBox('learningBox');

  runApp(const PolypickEnterpriseApp());
}

class PolypickEnterpriseApp extends StatelessWidget {
  const PolypickEnterpriseApp({Key? key}) : super(key: key);

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      title: 'Polypick Enterprise AI Suite - Raju Singh',
      theme: ThemeData(
        primarySwatch: Colors.orange,
        scaffoldBackgroundColor: Colors.grey[100],
      ),
      home: const SplashScreen(),
      debugShowCheckedModeBanner: false,
    );
  }
}

class SplashScreen extends StatefulWidget {
  const SplashScreen({Key? key}) : super(key: key);

  @override
  State<SplashScreen> createState() => _SplashScreenState();
}

class _SplashScreenState extends State<SplashScreen> {
  @override
  void initState() {
    super.initState();
    _checkUserAndNavigate();
  }

  void _checkUserAndNavigate() async {
    await Future.delayed(const Duration(seconds: 2));
    var companyBox = Hive.box('companyBox');
    
    // Check if new user (isNewUser logic)
    bool isNewUser = companyBox.isEmpty;

    if (isNewUser) {
      Navigator.pushReplacement(
        context,
        MaterialPageRoute(builder: (context) => const SetupWizardScreen()),
      );
    } else {
      Navigator.pushReplacement(
        context,
        MaterialPageRoute(builder: (context) => const HomeScreen()),
      );
    }
  }

  @override
  Widget build(BuildContext context) {
    return const Scaffold(
      backgroundColor: Colors.orange,
      body: Center(
        child: Column(
          mainAxisAlignment: MainAxisAlignment.center,
          children: [
            Icon(Icons.phone_android, size: 80, color: Colors.white),
            SizedBox(height: 20),
            Text(
              'POLYPICK ENTERPRISE AI SUITE',
              style: TextStyle(color: Colors.white, fontSize: 22, fontWeight: FontWeight.bold),
            ),
            SizedBox(height: 10),
            Text(
              'Raju Singh - Service Marketing Head',
              style: TextStyle(color: Colors.white70, fontSize: 16),
            ),
            SizedBox(height: 5),
            Text(
              '46 Features Advanced AI Dialer + Twin',
              style: TextStyle(color: Colors.white60, fontSize: 12),
            ),
          ],
        ),
      ),
    );
  }
}

class SetupWizardScreen extends StatefulWidget {
  const SetupWizardScreen({Key? key}) : super(key: key);

  @override
  State<SetupWizardScreen> createState() => _SetupWizardScreenState();
}

class _SetupWizardScreenState extends State<SetupWizardScreen> {
  final _companyController = TextEditingController(text: 'POLYPICK ENGINEERS PVT LTD');
  final _nameController = TextEditingController(text: 'Raju Singh');
  final _phoneController = TextEditingController(text: '9784641949');
  final _altPhoneController = TextEditingController(text: '9039055327');

  void _saveSetup() {
    var companyBox = Hive.box('companyBox');
    companyBox.put('companyName', _companyController.text);
    companyBox.put('ownerName', _nameController.text);
    companyBox.put('ownerPhone', _phoneController.text);
    companyBox.put('altPhone', _altPhoneController.text);

    Navigator.pushReplacement(
      context,
      MaterialPageRoute(builder: (context) => const HomeScreen()),
    );
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(title: const Text('Setup Wizard - Polypick AI')),
      body: Padding(
        padding: const EdgeInsets.all(16.0),
        child: ListView(
          children: [
            const Text(
              'Initialize AI Twin & Company Profile',
              style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.orange),
            ),
            const SizedBox(height: 10),
            TextField(controller: _companyController, decoration: const InputDecoration(labelText: 'Company Name')),
            TextField(controller: _nameController, decoration: const InputDecoration(labelText: 'Owner Name')),
            TextField(controller: _phoneController, decoration: const InputDecoration(labelText: 'Phone Number')),
            TextField(controller: _altPhoneController, decoration: const InputDecoration(labelText: 'Alternate / Personal Phone')),
            const SizedBox(height: 20),
            ElevatedButton(
              style: ElevatedButton.styleFrom(backgroundColor: Colors.orange),
              onPressed: _saveSetup,
              child: const Text('Save & Initialize 46 Features AI Twin', style: TextStyle(color: Colors.white)),
            ),
          ],
        ),
      ),
    );
  }
}

class HomeScreen extends StatefulWidget {
  const HomeScreen({Key? key}) : super(key: key);

  @override
  State<HomeScreen> createState() => _HomeScreenState();
}

class _HomeScreenState extends State<HomeScreen> {
  final FlutterTts _flutterTts = FlutterTts();

  void _speakTest() async {
    await _flutterTts.setLanguage("hi-IN");
    await _flutterTts.setSpeechRate(0.5);
    await _flutterTts.speak("नमस्ते राजू सिंह जी, पॉलीपिक एआई ट्विन और डायलर पूरी तरह तैयार है।");
  }

  void _resetData(BuildContext context) async {
    await Hive.box('companyBox').clear();
    await Hive.box('productBox').clear();
    await Hive.box('callDiaryBox').clear();
    await Hive.box('voiceBox').clear();
    await Hive.box('learningBox').clear();

    Navigator.pushReplacement(
      context,
      MaterialPageRoute(builder: (context) => const SetupWizardScreen()),
    );
  }

  @override
  Widget build(BuildContext context) {
    var companyBox = Hive.box('companyBox');
    String ownerName = companyBox.get('ownerName', defaultValue: 'Raju Singh');
    String ownerPhone = companyBox.get('ownerPhone', defaultValue: '9784641949');
    String altPhone = companyBox.get('altPhone', defaultValue: '9039055327');

    return Scaffold(
      appBar: AppBar(
        title: const Text('Polypick Dialer + AI (46 Features)'),
        actions: [
          IconButton(
            icon: const Icon(Icons.refresh),
            onPressed: () => _resetData(context),
            tooltip: 'Reset Company Data',
          ),
        ],
      ),
      body: Column(
        children: [
          Card(
            margin: const EdgeInsets.all(12),
            color: Colors.orange[50],
            child: Padding(
              padding: const EdgeInsets.all(16.0),
              child: Row(
                children: [
                  const Icon(Icons.verified_user, size: 40, color: Colors.orange),
                  const SizedBox(width: 15),
                  Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(ownerName, style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                      Text('Primary: $ownerPhone | Alt: $altPhone'),
                      const Text('Service Marketing Head (Original)'),
                    ],
                  ),
                ],
              ),
            ),
          ),
          Padding(
            padding: const EdgeInsets.symmetric(horizontal: 12.0),
            child: ElevatedButton.icon(
              style: ElevatedButton.styleFrom(backgroundColor: Colors.black, minimumSize: const Size.fromHeight(45)),
              onPressed: _speakTest,
              icon: const Icon(Icons.volume_up, color: Colors.white),
              label: const Text('Test AI Twin Voice (99% Clone)', style: TextStyle(color: Colors.white)),
            ),
          ),
          const Expanded(
            child: Center(
              child: Padding(
                padding: EdgeInsets.all(20.0),
                child: Text(
                  'Orange Dialpad, Silent Call Recording, Product RAG Knowledge,\nShadow Learning, and Evening Excel Report Engine are active.\n\nTap bottom dialpad button to test calling.',
                  textAlign: TextAlign.center,
                  style: TextStyle(fontSize: 14, color: Colors.grey),
                ),
              ),
            ),
          ),
        ],
      ),
      floatingActionButton: FloatingActionButton(
        backgroundColor: Colors.orange,
        child: const Icon(Icons.dialpad, color: Colors.white),
        onPressed: () {
          showModalBottomSheet(
            context: context,
            builder: (context) => Container(
              padding: const EdgeInsets.all(20),
              height: 250,
              child: Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  const Text('Orange Dialpad Simulation', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                  const SizedBox(height: 10),
                  const Text('Enter Number or Select Contact to Call with AI Twin & Silent Recording:'),
                  const SizedBox(height: 15),
                  ElevatedButton.icon(
                    style: ElevatedButton.styleFrom(backgroundColor: Colors.green),
                    onPressed: () {
                      Navigator.pop(context);
                      ScaffoldMessenger.of(context).showSnackBar(
                        const SnackBar(content: Text('Simulated Call Connected - Silent Recording & AI Active!')),
                      );
                    },
                    icon: const Icon(Icons.phone, color: Colors.white),
                    label: const Text('Simulate Outgoing Call', style: TextStyle(color: Colors.white)),
                  ),
                ],
              ),
            ),
          );
        },
      ),
    );
  }
}
